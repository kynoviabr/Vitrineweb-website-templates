<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitrine de Templates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #c8f135;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent); }

    .header-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Hero */
    .hero {
      padding: 5rem 2rem 3rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .hero p {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 500px;
      line-height: 1.7;
    }

    /* Filtros */
    .filters {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.4rem 1rem;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Grid */
    .grid {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem 5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .card-thumb {
      aspect-ratio: 16/10;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .card-thumb::after {
      content: 'Ver preview →';
      position: absolute;
      inset: 0;
      background: rgba(200, 241, 53, 0.9);
      color: #000;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .card-thumb::after { opacity: 1; }

    .card-body { padding: 1.25rem; }

    .card-number {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
    }

    .card-tag {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.2rem 0.6rem;
      background: #222;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Contador */
    .count {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Empty state */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">templates<span>.</span></div>
    <div class="header-meta" id="template-count">— templates</div>
  </header>

  <section class="hero">
    <h1>Escolha o site<br>ideal para <em>você.</em></h1>
    <p>Templates prontos, personalizáveis e entregues rapidinho. Selecione um modelo abaixo e entre em contato.</p>
  </section>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="todos">Todos</button>
  </div>

  <p class="count" id="count-label"></p>

  <div class="grid" id="grid"></div>

  <script>
    // =============================================
    // EDITE AQUI para adicionar seus templates
    // =============================================
    const templates = [
      {
        id: "01",
        nome: "Exemplo",
        categoria: "Institucional",
        emoji: "🏢",
        pasta: "./template-01-exemplo/index.html"
      },
      // Adicione mais templates seguindo o mesmo padrão:
      // {
      //   id: "02",
      //   nome: "Restaurante",
      //   categoria: "Alimentação",
      //   emoji: "🍽️",
      //   pasta: "./template-02-restaurante/index.html"
      // },
    ];
    // =============================================

    const grid = document.getElementById('grid');
    const filtersEl = document.getElementById('filters');
    const countLabel = document.getElementById('count-label');
    const templateCount = document.getElementById('template-count');

    // Categorias únicas
    const categorias = [...new Set(templates.map(t => t.categoria))];
    categorias.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.filter = cat;
      btn.textContent = cat;
      filtersEl.appendChild(btn);
    });

    let filtroAtivo = 'todos';

    function render() {
      const filtered = filtroAtivo === 'todos'
        ? templates
        : templates.filter(t => t.categoria === filtroAtivo);

      countLabel.textContent = `${filtered.length} template${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;
      templateCount.textContent = `${templates.length} templates`;

      grid.innerHTML = filtered.length === 0
        ? '<div class="empty">Nenhum template nessa categoria ainda.</div>'
        : filtered.map(t => `
          <a class="card" href="${t.pasta}" target="_blank">
            <div class="card-thumb">${t.emoji}</div>
            <div class="card-body">
              <div class="card-number">Nº ${t.id}</div>
              <div class="card-title">${t.nome}</div>
              <span class="card-tag">${t.categoria}</span>
            </div>
          </a>
        `).join('');
    }

    filtersEl.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroAtivo = btn.dataset.filter;
      render();
    });

    render();
  </script>

</body>
</html>
